services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  server:
    build: ./server
    env_file: server/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "5000:5000"
    depends_on:
      - db
  client:
    build: ./client
    ports:
      - "3000:3000"
    depends_on:
      - server


volumes:
  pgdata:
    name: ai_blog_pgdata
